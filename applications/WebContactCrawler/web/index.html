<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebContactCrawler</title><style>body{font:14px system-ui;margin:24px;background:#111;color:#eee}main{max-width:1100px;margin:auto}.bar{height:22px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#4caf50}button,input{padding:9px;margin:4px}pre{background:#181818;padding:12px;min-height:160px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#191919;padding:14px;border-radius:8px}</style></head><body><main><h1>WebContactCrawler</h1><input id="url" placeholder="https://example.org" size="45"><input id="kw" placeholder="keywords"><button onclick="start()">Start</button><button onclick="stop()">Stop</button><div class="bar"><div id="fill" class="fill"></div></div><div class="grid"><div class="card">Pages <b id="pages">0</b></div><div class="card">Queued <b id="queued">0</b></div><div class="card">Emails <b id="emails">0</b></div><div class="card">Errors <b id="errors">0</b></div></div><h2>Results</h2><pre id="out"></pre><script>let running=false,p=0;function start(){running=true;p=0;document.getElementById('out').textContent='Session started\n'+document.getElementById('url').value+'\nKeywords: '+document.getElementById('kw').value;tick()}function stop(){running=false;document.getElementById('out').textContent+='\nCancelled by user'}function tick(){if(!running)return;p=Math.min(100,p+5);fill.style.width=p+'%';pages.textContent=Math.round(p*2);queued.textContent=Math.round((100-p)/5);emails.textContent=Math.round(p/4);errors.textContent=0;if(p<100)setTimeout(tick,400);else{running=false;out.textContent+='\nDone'}} </script></main></body></html>
