[pacman]
format="pkg.tar.*"
backend="libalpm"
model="native"

[debian]
format="deb"
backend="dpkg+apt"
model="transactional"

[rpm]
format="rpm"
backend="rpm+dnf"
model="transactional"

[yum]
format="rpm"
backend="rpm+dnf-compat"
model="compatibility"

[apk]
format="apk"
backend="apk-tools"
model="native"

[nix]
format="nix-derivation"
backend="nix"
model="declarative"

[flatpak]
format="flatpak"
backend="portal+sandbox"
model="sandboxed-app"

[snap]
format="snap"
backend="snapd"
model="sandboxed-app"

[appimage]
format="AppImage"
backend="fuse-or-extract"
model="portable-app"

[git]
format="source"
backend="git"
model="source-build"

[github]
format="source"
backend="gh+git"
model="source-build"
