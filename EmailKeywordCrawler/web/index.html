<!doctype html><html><head><meta charset="utf-8"><title>EmailKeywordCrawler</title><style>body{font-family:system-ui;margin:2rem}progress{width:100%}pre{background:#111;color:#eee;padding:1rem;height:280px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.card{padding:1rem;border:1px solid #ccc;border-radius:8px}</style></head><body><h1>Email Keyword Crawler</h1><p>Public/authorized web research dashboard.</p><input id="url" placeholder="https://example.org" size="50"><input id="kw" placeholder="keyword"><button onclick="start()">Start</button><progress id="p" max="100" value="0"></progress><div class="grid"><div class="card">Visited <b id="v">0</b></div><div class="card">Queued <b id="q">0</b></div><div class="card">Emails <b id="e">0</b></div><div class="card">Errors <b id="x">0</b></div></div><pre id="log"></pre><script>function start(){document.querySelector('#log').textContent='Start a local API worker and POST {url,keywords,depth,concurrency}. The static UI is intentionally API-agnostic.'}</script></body></html>
