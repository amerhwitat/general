name: SEO-Tool CI
on:
  push:
    paths: ['SEO-Tool/**']
  pull_request:
    paths: ['SEO-Tool/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e './SEO-Tool[audit]'
      - run: python -m pytest -q SEO-Tool/tests
