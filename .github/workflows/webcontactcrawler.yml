name: WebContactCrawler
on:
  push:
    paths:
      - 'applications/WebContactCrawler/**'
      - '.github/workflows/webcontactcrawler.yml'
  pull_request:
    paths:
      - 'applications/WebContactCrawler/**'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/WebContactCrawler/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile webcontactcrawler.py gui_server.py
