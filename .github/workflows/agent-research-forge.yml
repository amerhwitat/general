name: AgentResearchForge CI
on:
  push:
    paths:
      - 'AgentResearchForge/**'
      - '.github/workflows/agent-research-forge.yml'
  pull_request:
    paths:
      - 'AgentResearchForge/**'
      - '.github/workflows/agent-research-forge.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentResearchForge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[api,documents,exports]'
      - run: python -m pytest -q
