<!doctype html><html lang="en"><meta charset="utf-8"><title>Chimera Email List Manager</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem}input,button{padding:.6rem;margin:.25rem}table{width:100%;border-collapse:collapse}td,th{padding:.5rem;border-bottom:1px solid #ccc}.score{font-variant-numeric:tabular-nums}</style><h1>Email List Manager</h1><p>Local/public-contact list management. No automatic mail sending.</p><input id="email" placeholder="email"><input id="name" placeholder="name"><input id="tags" placeholder="tags"><button onclick="add()">Add</button><button onclick="exportCsv()">Export CSV</button><table><thead><tr><th>Email</th><th>Name</th><th>Tags</th><th>RNN score</th></tr></thead><tbody id="rows"></tbody></table><script>const data=[];function score(s){let x=0;for(const c of s.slice(0,4096))x=Math.tanh(.86*x+.14*(c.charCodeAt(0)%97)/96);return((x+1)/2).toFixed(4)}function add(){const e=email.value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return alert('Invalid email');if(data.some(x=>x.email===e))return;data.push({email:e,name:name.value,tags:tags.value});render()}function render(){rows.innerHTML=data.map(x=>`<tr><td>${x.email}</td><td>${x.name}</td><td>${x.tags}</td><td class="score">${score(x.email+' '+x.tags)}</td></tr>`).join('')}function exportCsv(){const s='email,name,tags\n'+data.map(x=>[x.email,x.name,x.tags].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='email-list.csv';a.click()}</script></html>
