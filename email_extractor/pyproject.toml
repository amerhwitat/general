[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-extractor"
version = "0.1.0"
description = "Cross-platform public/authorized-web email extraction and persistence tools"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "dnspython>=2.4", "PyQt5>=5.15"]

[project.scripts]
email-extractor = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
