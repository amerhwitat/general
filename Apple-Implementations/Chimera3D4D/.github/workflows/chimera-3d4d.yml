name: Chimera 3D/4D

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Apple-Implementations/Chimera3D4D -B build/chimera3d4d -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/chimera3d4d --parallel
      - name: Test
        run: ctest --test-dir build/chimera3d4d --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: Apple-Implementations/Chimera3D4D/web
        run: npm install
      - name: Build
        working-directory: Apple-Implementations/Chimera3D4D/web
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        working-directory: Apple-Implementations/Chimera3D4D/flutter
        run: flutter pub get
      - name: Analyze
        working-directory: Apple-Implementations/Chimera3D4D/flutter
        run: flutter analyze
      - name: Build web
        working-directory: Apple-Implementations/Chimera3D4D/flutter
        run: flutter build web --release

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate Xcode project when XcodeGen is available
        working-directory: Apple-Implementations/Chimera3D4D/apple
        run: |
          if command -v xcodegen >/dev/null 2>&1; then xcodegen generate; else echo 'XcodeGen not installed; native project generation skipped'; fi
      - name: Build macOS without signing when generated project exists
        working-directory: Apple-Implementations/Chimera3D4D/apple
        run: |
          if [ -f Chimera3D4D.xcodeproj/project.pbxproj ]; then
            xcodebuild -project Chimera3D4D.xcodeproj -scheme Chimera3D4D-macOS -configuration Release CODE_SIGNING_ALLOWED=NO build
          else
            echo 'Generated Xcode project not present; native build is intentionally not asserted.'
          fi
